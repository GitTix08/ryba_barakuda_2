<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>🐠🐟🐡🦈</title>
        <style>
            body{
                background-color: black;
                color: white;
                font-family: 'Comic Sans MS';
            }
            .rainbow-bg{
                    animation: rainbow-bg 2.5s linear;
                    animation-iteration-count: infinite;
            }

            @keyframes rainbow-bg{
                    100%,0%{
                        background-color: rgb(255,0,0);
                    }
                    8%{
                        background-color: rgb(255,127,0);
                    }
                    16%{
                        background-color: rgb(255,255,0);
                    }
                    25%{
                        background-color: rgb(127,255,0);
                    }
                    33%{
                        background-color: rgb(0,255,0);
                    }
                    41%{
                        background-color: rgb(0,255,127);
                    }
                    50%{
                        background-color: rgb(0,255,255);
                    }
                    58%{
                        background-color: rgb(0,127,255);
                    }
                    66%{
                        background-color: rgb(0,0,255);
                    }
                    75%{
                        background-color: rgb(127,0,255);
                    }
                    83%{
                        background-color: rgb(255,0,255);
                    }
                    91%{
                        background-color: rgb(255,0,127);
                    }
            }

        </style>
    </head>
    <body>
        <div id="tsparticles"></div>
        <h3>maszyna losująca barakuda symulator</h3>
        <h5>jaką rybe dostaniesz?</h5>
        <button id="wasuj">łów</button>
        <h5 id="result" style="margin: 0; margin-top: 10px;"></h5>
        <script src="https://cdn.jsdelivr.net/npm/tsparticles@3.0.3/tsparticles.bundle.min.js"></script>
        <script>
            function playconfetti() {
                tsParticles.load({
                        id: "tsparticles",
                        options: {
                "fullScreen": {
                    "zIndex": 1
                },
                "particles": {
                    "color": {
                    "value": [
                        "#FFFFFF",
                        "#FFd700"
                    ]
                    },
                    "move": {
                    "direction": "bottom",
                    "enable": true,
                    "outModes": {
                        "default": "out"
                    },
                    "size": true,
                    "speed": {
                        "min": 1,
                        "max": 5
                    }
                    },
                    "number": {
                    "value": 5000,
                    "density": {
                        "enable": true,
                        "area": 800
                    }
                    },
                    "opacity": {
                    "value": 1,
                    "animation": {
                        "enable": false,
                        "startValue": "max",
                        "destroy": "min",
                        "speed": 0.3,
                        "sync": true
                    }
                    },
                    "rotate": {
                    "value": {
                        "min": 0,
                        "max": 360
                    },
                    "direction": "random",
                    "move": true,
                    "animation": {
                        "enable": true,
                        "speed": 60
                    }
                    },
                    "tilt": {
                    "direction": "random",
                    "enable": true,
                    "move": true,
                    "value": {
                        "min": 0,
                        "max": 36000
                    },
                    "animation": {
                        "enable": true,
                        "speed": 60
                    }
                    },
                    "shape": {
                    "type": [
                        "circle",
                        "square"
                    ],
                    "options": {}
                    },
                    "size": {
                    "value": {
                        "min": 2,
                        "max": 4
                    }
                    },
                    "roll": {
                    "darken": {
                        "enable": true,
                        "value": 30
                    },
                    "enlighten": {
                        "enable": true,
                        "value": 30
                    },
                    "enable": true,
                    "speed": {
                        "min": 15,
                        "max": 25
                    }
                    },
                    "wobble": {
                    "distance": 30,
                    "enable": true,
                    "move": true,
                    "speed": {
                        "min": -15,
                        "max": 150
                    }
                    }
                }
                }
                });
            }
        </script>
        <script>
            const wyniki = [
                "mintaj",
                "łosoś",
                "barakuda",
                "śledź",
                "karp",
                "złota rybka",
                "rozdymka",
                "płaszczka",
                "rekin",
                "wieloryb",
                "orka"
            ]

            Array.prototype.random = function () {
                return this[Math.floor((Math.random()*this.length))];
            }


            document.getElementById('wasuj').addEventListener("click", async (e) => {
                document.getElementById("result").style.color = "white";
                for (let i = 0; i < 400; i += 25) {
                    await new Promise((res) => setTimeout(res, i))
                    document.getElementById("result").innerText = wyniki.random()
                }
                document.getElementById("result").style.color = "green";
                document.getElementById("result").style.fontSize = "70px";
                document.body.className = "rainbow-bg"
                playconfetti()
            })
        </script>
    </body>
</html>
